name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write document version
        run: bash .scripts/version.sh

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: tex
          latexmk_use_lualatex: false

      - name: Collect PDF
        run: |
          mkdir -p pdf
          cp tex/main.pdf pdf/Stardust-NEXT-Podrecznik.pdf

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: Stardust-NEXT-Podrecznik
          path: pdf/Stardust-NEXT-Podrecznik.pdf

      - name: Link to PDF in run summary
        run: |
          echo "### 📄 [Pobierz PDF](${{ steps.upload.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request with PDF link
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const marker = '<!-- pdf-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `${marker}\n### 📄 PDF z tego PR\n\n[**Pobierz PDF**](${process.env.ARTIFACT_URL}) (commit \`${sha}\`)\n\nGitHub pobiera plik jako archiwum ZIP z PDF w środku. Link działa po zalogowaniu, przez 90 dni.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const old = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (old) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf/Stardust-NEXT-Podrecznik.pdf
