name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-lang-polish lmodern fonts-dejavu imagemagick

      - name: Build PDF
        run: bash .scripts/generate_pdf.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stardust-NEXT-Manual
          path: pdf/Stardust-NEXT-Manual.pdf

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf/Stardust-NEXT-Manual.pdf
