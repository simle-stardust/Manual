name: Build PDF

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write document version
        run: bash .scripts/version.sh

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: tex
          latexmk_use_lualatex: false

      - name: Collect PDF
        run: |
          mkdir -p pdf
          cp tex/main.pdf pdf/Stardust-NEXT-Podrecznik.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stardust-NEXT-Podrecznik
          path: pdf/Stardust-NEXT-Podrecznik.pdf

      - name: Attach PDF to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: pdf/Stardust-NEXT-Podrecznik.pdf
